services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - appdb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appdb -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - appdb

  app:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://appdb:${POSTGRES_PASSWORD}@db:5432/appdb
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_HTTPS_ONLY: "true"
      TRUSTED_PROXY_HOSTS: 172.29.0.1
      OAUTH_CALLBACK_URL: https://superduper.188-120-224-148.sslip.io/auth/github/callback
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      APPDB_ADMIN_GITHUB_LOGINS: joewebkid
      SEED_DEMO_DATA: "false"
      REPORTS_PER_USER_PER_HOUR: "10"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18083:8000"
    networks:
      - appdb

volumes:
  appdb-postgres:

networks:
  appdb:
    ipam:
      config:
        - subnet: 172.29.0.0/24


